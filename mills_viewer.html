<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mills — Kanban Oficinas (Visualização)</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --laranja:#F37021;--bg:#F8F7F4;--bg2:#fff;--bg3:#F2EFE8;--bg4:#EBE3C7;
  --text:#1a1a1a;--text2:#3a3a38;--text3:#888780;
  --borda:#E0D9C8;--borda2:#C8C0A8;
  --verde:#004042;--verde2:#1D9E75;--terra:#C24003;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px}

/* HEADER */
.header{background:var(--verde);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;border-bottom:3px solid var(--laranja)}
.hbrand{display:flex;align-items:center;gap:12px}
.hlogo{height:34px;width:auto}
.htitle{color:#fff;font-size:13px;font-weight:500}
.htitle span{color:rgba(255,255,255,.5);font-size:11px;margin-left:6px}
.hright{display:flex;align-items:center;gap:12px}
.sync-badge{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:500}
.sync-ok{background:rgba(29,158,117,.2);color:#6BFAC7;border:1px solid rgba(29,158,117,.3)}
.sync-loading{background:rgba(243,112,33,.15);color:var(--laranja);border:1px solid rgba(243,112,33,.3)}
.sync-err{background:rgba(194,64,3,.2);color:#F59F60;border:1px solid rgba(194,64,3,.3)}
.readonly-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);letter-spacing:.04em;border:1px solid rgba(255,255,255,.2)}
.hdate{color:rgba(255,255,255,.4);font-size:11px}

/* TABS */
.tabs-bar{background:var(--verde);padding:0 16px;display:flex;gap:1px;border-bottom:1px solid rgba(255,255,255,.1);overflow-x:auto}
.tab{padding:9px 14px;font-size:12px;font-weight:500;color:rgba(255,255,255,.45);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;user-select:none}
.tab:hover{color:rgba(255,255,255,.75)}
.tab.active{color:var(--laranja);border-bottom-color:var(--laranja)}
.tab-n{display:inline-block;background:rgba(255,255,255,.1);border-radius:8px;padding:1px 5px;font-size:10px;margin-left:4px;color:rgba(255,255,255,.5)}
.tab.active .tab-n{background:var(--laranja);color:#fff}
.page{display:none}.page.active{display:block}

/* KPIs */
.kpi-wrap{padding:14px 18px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg2);border-radius:10px;padding:14px 16px;border:1px solid var(--borda)}
.kpi-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:4px}
.kpi-value{font-size:28px;font-weight:700;line-height:1;color:var(--text)}
.kpi-value.orange{color:var(--laranja)}.kpi-value.terra{color:var(--terra)}.kpi-value.verde{color:var(--verde2)}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:3px}
.kpi-bar{height:3px;border-radius:2px;margin-top:8px;background:var(--bg3)}
.kpi-bar-fill{height:100%;border-radius:2px;background:var(--laranja)}
.of-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.of-card{background:var(--bg2);border-radius:10px;border:1px solid var(--borda);overflow:hidden;cursor:pointer;transition:all .15s}
.of-card:hover{border-color:var(--laranja);transform:translateY(-2px)}
.of-card-hd{background:var(--verde);padding:9px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--borda)}
.of-card-name{color:#fff;font-weight:600;font-size:12px}
.of-card-total{background:var(--laranja);color:#fff;border-radius:8px;padding:2px 7px;font-size:10px;font-weight:600}
.of-card-body{padding:10px 12px;display:flex;gap:14px}
.of-stat{flex:1}
.of-stat-n{font-size:20px;font-weight:700}
.of-stat-n.disp{color:var(--verde2)}.of-stat-n.manut{color:var(--terra)}
.of-stat-l{font-size:10px;color:var(--text3)}
.of-prog{padding:0 12px 10px}
.of-prog-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.of-prog-fill{height:100%;background:var(--laranja);border-radius:3px}
.of-prog-label{font-size:10px;color:var(--text3);margin-top:3px;display:flex;justify-content:space-between}
.etapas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;margin-bottom:14px}
.etapa-bi{background:var(--bg2);border-radius:9px;border:1px solid var(--borda);overflow:hidden;cursor:pointer;transition:border-color .15s}
.etapa-bi:hover{border-color:var(--laranja)}
.etapa-bi-strip{height:4px}
.etapa-bi-body{padding:10px 12px}
.etapa-bi-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:3px}
.etapa-bi-total{font-size:24px;font-weight:700;color:var(--text)}
.etapa-bi-sub{font-size:9px;color:var(--text3)}
.sec-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:10px;margin-top:16px;padding-bottom:5px;border-bottom:1px solid var(--borda)}

/* KANBAN */
.kanban-wrap{padding:12px 16px}
.kanban-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.kanban-title{font-size:14px;font-weight:600;color:var(--text);flex:1}
.search-box{padding:7px 10px;border:1px solid var(--borda);border-radius:6px;font-size:12px;background:var(--bg2);outline:none;width:160px;color:var(--text)}
.search-box:focus{border-color:var(--laranja)}
.filter-sel{padding:7px 8px;border:1px solid var(--borda);border-radius:6px;font-size:11px;background:var(--bg2);outline:none;color:var(--text2)}
.kanban-layout{display:flex;gap:0;width:100%;height:calc(100vh - 200px)}
.kanban-board-wrap{flex:1;min-width:0;overflow-x:auto;padding-right:8px;height:100%}
.kanban-board{display:inline-flex;gap:8px;padding-bottom:10px;align-items:flex-start;height:100%;min-width:max-content}
.kcol{flex:0 0 200px;background:var(--bg3);border-radius:10px;border:1px solid var(--borda);display:flex;flex-direction:column;height:calc(100vh - 218px)}
.kcol-hd{padding:10px 12px 8px;border-bottom:1px solid var(--borda)}
.kcol-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)}
.kcol-count{font-size:22px;font-weight:700;color:var(--text);line-height:1.2}
.kcol-body{padding:6px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.card{background:#fff;border-radius:9px;border:1px solid var(--borda);padding:10px 12px;user-select:none}
.card.reservado{border-left:3px solid var(--verde2)}
.card.semana-atual{background:#FFFDE7;border-color:#F5D700}
.card-id{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.card-equip{font-size:13px;font-weight:600;color:var(--verde);line-height:1.3;margin-bottom:2px}
.card-modelo{font-size:11px;color:var(--text3);margin-bottom:4px}
.card-tipo{font-size:10px;color:var(--text3);font-style:italic;margin-bottom:5px}
.card-divider{height:1px;background:var(--borda);margin:5px 0}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:wrap;margin-top:3px}
.card-dias{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:3px}
.dd{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dd-ok{background:var(--verde2)}.dd-warn{background:var(--laranja)}.dd-crit{background:var(--terra)}
.prio-pill{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700}
.prio-critica{background:#FDE8E8;color:#7B1515}
.prio-alta{background:#FDEEE6;color:#7B3300}
.prio-media{background:#FFF8E6;color:#7A5500}
.prio-baixa{background:#E6F4F0;color:var(--verde)}
.sem-pill{font-size:9px;color:var(--text3);background:var(--bg3);border:1px solid var(--borda);border-radius:3px;padding:1px 4px}
.badge-semana-atual{background:#F5D700;color:#5A4000;border-radius:3px;padding:1px 5px;font-size:9px;font-weight:700}
.badge-reservado{background:#E6F4F0;color:var(--verde2);border:1px solid rgba(29,158,117,.2);border-radius:4px;padding:2px 6px;font-size:9px;font-weight:600}
.card-cliente{font-size:10px;color:var(--verde2);margin-top:3px;font-weight:500}
.card-embarque{font-size:9px;margin-top:2px;font-weight:600}
.card-assinatura{font-size:9px;color:var(--laranja);margin-top:3px;border-top:1px dashed var(--borda);padding-top:3px}

/* SUBTABS */
.subtabs{display:flex;gap:4px}
.subtab{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--borda);background:var(--bg2);color:var(--text2);transition:all .15s}
.subtab.active{background:var(--laranja);color:#fff;border-color:var(--laranja)}

/* ETAPAS OFICINA */
.kcol-oficina{flex:0 0 180px}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--borda2);border-radius:3px}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:var(--verde);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.loading-logo{height:50px;width:auto}
.loading-text{color:rgba(255,255,255,.7);font-size:13px}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--verde2);display:inline-block;animation:pulse 2s infinite;margin-right:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>

function setSyncStatus(s){
  const el=document.getElementById('sync-badge');if(!el)return;
  if(s==='ok'){el.textContent='● Tempo real';el.className='sync-badge sync-ok';}
  else if(s==='loading'){el.textContent='↻ Conectando...';el.className='sync-badge sync-loading';}
  else{el.textContent='✕ Offline';el.className='sync-badge sync-err';}
}

function sid(of){return of.replace(/ /g,'_').replace(/[()]/g,'').replace(/\//g,'_');}
function diasLabel(ts){if(!ts)return'Hoje';const d=Math.floor((Date.now()-ts)/86400000);return d===0?'Hoje':d===1?'1 dia':d+' dias';}
function diasClass(ts){if(!ts)return'dd-ok';const d=Math.floor((Date.now()-ts)/86400000);return d<=3?'dd-ok':d<=10?'dd-warn':'dd-crit';}
function semanaAtual(){const h=new Date(),seg=new Date(h);seg.setDate(h.getDate()-((h.getDay()+6)%7));const ini=new Date(seg.getFullYear(),0,1);const n=Math.ceil((((seg-ini)/86400000)+ini.getDay()+1)/7);return`${seg.getFullYear()}-W${String(n).padStart(2,'0')}`;}
function semanaLabel(v){const s=SEMANAS_LISTA.find(s=>s.value===v);return s?s.label:v;}
function prioLabel(p){return{critica:'🔴 Crítica',alta:'🟠 Alta',media:'🟡 Média',baixa:'🟢 Baixa'}[p]||'';}
function getAtivos(){return Object.values(state).filter(e=>!e.baixado);}
function getByOficinaSid(s){return getAtivos().filter(e=>sid(e.oficina||'')===s);}
function oficinas(){return[...new Set(EQUIPAMENTOS_ORIG.map(e=>e.oficina).filter(Boolean))].sort();}

// Firebase
async function loadAll(){
  setSyncStatus('loading');
  try{
    const r=await fetch(`${FB_BASE}/equipamentos.json`);
    if(!r.ok)throw new Error(r.status);
    const data=await r.json();
    if(data){
      Object.entries(data).forEach(([id,d])=>{
        if(!d)return;
        if(state[id]){Object.assign(state[id],d);}
        else if(d.equipamento&&!d.baixado){
          state[id]={id:d.id||id,equipamento:d.equipamento,modelo:d.modelo||'',tipo:d.tipo||'',
            oficina:d.oficina||'',status:d.status||'',etapa:d.etapa||'chegada',
            etapa_desde:d.etapa_desde||Date.now(),etapa_interna:d.etapa_interna||null,
            prioridade:d.prioridade||null,semana:d.semana||null,reservado:d.reservado||false,
            cliente:d.cliente||'',dataEmbarque:d.dataEmbarque||'',baixado:false,
            assinaturas:d.assinaturas||{},ordemManusis:d.ordemManusis||'',reqCompra:d.reqCompra||''};
        }
      });
    }
    setSyncStatus('ok');
    buildUI();
    startListen();
  }catch(e){setSyncStatus('error');buildUI();}
  document.getElementById('loading').style.display='none';
}

function startListen(){
  const es=new EventSource(`${FB_BASE}/equipamentos.json?accept=text/event-stream`);
  es.addEventListener('put',ev=>{
    try{
      const msg=JSON.parse(ev.data);if(!msg.data)return;
      if(msg.path==='/'){
        Object.entries(msg.data).forEach(([id,d])=>{
          if(state[id]){Object.assign(state[id],d);}
          else if(d&&d.equipamento&&!d.baixado){
            state[id]={id:d.id||id,equipamento:d.equipamento,modelo:d.modelo||'',tipo:d.tipo||'',
              oficina:d.oficina||'',status:d.status||'',etapa:d.etapa||'chegada',
              etapa_desde:d.etapa_desde||Date.now(),etapa_interna:d.etapa_interna||null,
              prioridade:d.prioridade||null,semana:d.semana||null,reservado:d.reservado||false,
              cliente:d.cliente||'',dataEmbarque:d.dataEmbarque||'',baixado:false,
              assinaturas:d.assinaturas||{},ordemManusis:d.ordemManusis||'',reqCompra:d.reqCompra||''};
          }
        });
      } else {
        const parts=msg.path.split('/').filter(Boolean);
        const id=parts[0];
        if(!id)return;
        if(parts.length===1&&msg.data){if(state[id])Object.assign(state[id],msg.data);}
        else if(parts.length===2&&state[id]){state[id][parts[1]]=msg.data;}
      }
      reRender();
    }catch(ex){}
  });
  es.onerror=()=>setSyncStatus('error');
}

function buildTabs(){
  const bar=document.getElementById('tabs-bar');
  const ofs=oficinas();
  const ativos=getAtivos();
  let tabs=`<div class="tab active" data-tab="bi" onclick="switchTab('bi')">BI Geral <span class="tab-n">${ativos.length}</span></div>`;
  ofs.forEach(of=>{
    const s=sid(of);
    const n=getByOficinaSid(s).length;
    tabs+=`<div class="tab" data-tab="${s}" onclick="switchTab('${s}')">${of} <span class="tab-n">${n}</span></div>`;
  });
  bar.innerHTML=tabs;
}

function buildPages(){
  const container=document.getElementById('pages-container');
  const ofs=oficinas();
  let html=`<div class="page active" id="page-bi"></div>`;
  ofs.forEach(of=>{
    const s=sid(of);
    html+=`<div class="page" id="page-${s}">
      <div class="kanban-wrap">
        <div class="kanban-toolbar">
          <span class="kanban-title" id="title-${s}">${of}</span>
          <div class="subtabs">
            <button class="subtab active" id="subtab-${s}-geral" onclick="switchSubtab('${s}','geral')">Visão Geral</button>
            <button class="subtab" id="subtab-${s}-oficina" onclick="switchSubtab('${s}','oficina')">Visão Oficina</button>
          </div>
          <input class="search-box" type="text" placeholder="Buscar..." oninput="renderBoard('${s}','geral');renderBoard('${s}','oficina')" id="search-${s}">
        </div>
        <div class="kanban-layout">
          <div class="kanban-board-wrap">
            <div class="kanban-board" id="board-${s}-geral"></div>
            <div class="kanban-board" id="board-${s}-oficina" style="display:none"></div>
          </div>
        </div>
      </div>
    </div>`;
  });
  container.innerHTML=html;
}

function switchTab(tabId){
  activeTab=tabId;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tabId));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+tabId));
  if(tabId==='bi')renderBI();
  else renderBoard(tabId,'geral');
}

function switchSubtab(sid_,v){
  const bg=document.getElementById(`board-${sid_}-geral`);
  const bo=document.getElementById(`board-${sid_}-oficina`);
  document.getElementById(`subtab-${sid_}-geral`).classList.toggle('active',v==='geral');
  document.getElementById(`subtab-${sid_}-oficina`).classList.toggle('active',v==='oficina');
  if(bg)bg.style.display=v==='geral'?'inline-flex':'none';
  if(bo)bo.style.display=v==='oficina'?'inline-flex':'none';
  renderBoard(sid_,v);
}

function reRender(){
  updateTabCounts();
  if(activeTab==='bi')renderBI();
  else renderBoard(activeTab,'geral');
}

function updateTabCounts(){
  const ativos=getAtivos();
  document.querySelectorAll('.tab[data-tab]').forEach(tab=>{
    const id=tab.dataset.tab;
    if(id==='bi'){const n=tab.querySelector('.tab-n');if(n)n.textContent=ativos.length;return;}
    const n=tab.querySelector('.tab-n');
    if(n)n.textContent=getByOficinaSid(id).length;
  });
}

function renderBI(){
  const pg=document.getElementById('page-bi');if(!pg)return;
  const ativos=getAtivos();
  const total=ativos.length||1;
  const disp=ativos.filter(e=>e.etapa==='chegada'||e.etapa==='pronto').length;

  const prog=ativos.filter(e=>e.semana).length;
  const retrab=ativos.filter(e=>e.retrabalho>0).length;
  const dp=Math.round(disp/total*100),mp=Math.round(manut/total*100);

  // Etapas
  const cntEt={};ETAPAS_GERAL.forEach(e=>cntEt[e.id]=0);
  ativos.forEach(e=>{if(cntEt[e.etapa]!==undefined)cntEt[e.etapa]++;});
  const maxEt=Math.max(...Object.values(cntEt),1);
  const semAtual=semanaAtual();

  const etapasHtml=ETAPAS_GERAL.map(et=>{
    const n=cntEt[et.id]||0,pct=Math.round(n/total*100),bw=Math.round(n/maxEt*100);

    return`<div class="etapa-bi"><div class="etapa-bi-strip" style="background:${CORES_ET[et.id]||'#888'}"></div>
      <div class="etapa-bi-body"><div class="etapa-bi-label">${et.label}</div>

  }).join('');

  // Oficinas
  const ofs=oficinas();
  const ofHtml=ofs.map(of=>{
    const s=sid(of);
    const lst=getByOficinaSid(s);
    const nd=lst.filter(e=>e.etapa==='chegada'||e.etapa==='pronto').length;
    const nm=lst.filter(e=>e.etapa==='manutencao'||e.etapa==='cl_entrada'||e.etapa==='cl_saida').length;
    const dw=lst.length?Math.round(nd/lst.length*100):0;
    return`<div class="of-card" onclick="switchTab('${s}')">
      <div class="of-card-hd"><span class="of-card-name">${of}</span><span class="of-card-total">${lst.length}</span></div>
      <div class="of-card-body">
        <div class="of-stat"><div class="of-stat-n disp">${nd}</div><div class="of-stat-l">Disponíveis</div></div>
        <div class="of-stat"><div class="of-stat-n manut">${nm}</div><div class="of-stat-l">Manutenção</div></div>
      </div>
      <div class="of-prog"><div class="of-prog-bar"><div class="of-prog-fill" style="width:${dw}%"></div></div>
      <div class="of-prog-label"><span>disponibilidade</span><span>${dw}%</span></div></div>
    </div>`;
  }).join('');

  pg.innerHTML=`<div class="kpi-wrap">
    <div class="sec-title">Indicadores gerais</div>
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">Total frota</div><div class="kpi-value">${total}</div><div class="kpi-sub">equipamentos ativos</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:100%"></div></div></div>
      <div class="kpi"><div class="kpi-label">Disponíveis</div><div class="kpi-value orange">${disp}</div><div class="kpi-sub">${dp}% do total</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${dp}%;background:var(--verde2)"></div></div></div>
      <div class="kpi"><div class="kpi-label">Em manutenção</div><div class="kpi-value terra">${manut}</div><div class="kpi-sub">${mp}% do total</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${mp}%;background:var(--terra)"></div></div></div>
      <div class="kpi"><div class="kpi-label">Reservados</div><div class="kpi-value verde">${res}</div><div class="kpi-sub">${Math.round(res/total*100)}% da frota</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.round(res/total*100)}%;background:var(--verde2)"></div></div></div>
      <div class="kpi"><div class="kpi-label">Programados</div><div class="kpi-value orange">${prog}</div><div class="kpi-sub">com semana definida</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.round(prog/total*100)}%"></div></div></div>
      <div class="kpi"><div class="kpi-label">Retrabalhos</div><div class="kpi-value terra">${retrab}</div><div class="kpi-sub">equipamentos c/ ocorrência</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.round(retrab/total*100)}%;background:var(--terra)"></div></div></div>
    </div>
    <div class="sec-title">Por etapa do kanban</div>
    <div class="etapas-grid">${etapasHtml}</div>
    <div class="sec-title">Por oficina</div>
    <div class="of-grid">${ofHtml}</div>
  </div>`;
}

function renderBoard(sid_,visao){
  const boardId=`board-${sid_}-${visao}`;
  const board=document.getElementById(boardId);if(!board)return;
  board.innerHTML='';
  const equips=getByOficinaSid(sid_);
  const search=(document.getElementById(`search-${sid_}`)||{}).value||'';
  const fv=search.toLowerCase();
  const etapas=visao==='geral'?ETAPAS_GERAL:ETAPAS_OFICINA;
  const prioOrder={critica:0,alta:1,media:2,baixa:3};
  const semAtual=semanaAtual();

  // Atualizar título
  const titulo=document.getElementById(`title-${sid_}`);
  if(titulo&&equips.length){const of=equips[0].oficina;titulo.innerHTML=`${of} — <span style="color:var(--laranja)">${equips.length} equipamentos</span>`;}

  etapas.forEach(etapa=>{
    let items=visao==='geral'
      ?equips.filter(e=>e.etapa===etapa.id)
      :equips.filter(e=>e.etapa==='manutencao'&&(e.etapa_interna||'lavagem')===etapa.id);
    if(fv)items=items.filter(e=>e.id.toLowerCase().includes(fv)||e.equipamento.toLowerCase().includes(fv)||(e.modelo||'').toLowerCase().includes(fv));
    items.sort((a,b)=>(prioOrder[a.prioridade]??4)-(prioOrder[b.prioridade]??4));

    const col=document.createElement('div');
    const extraCls=visao==='oficina'?' kcol-oficina':'';
    col.className=`kcol${extraCls}`;
    col.dataset.etapa=etapa.id;

    const corStrip=CORES_ET[etapa.id]||'#888';
    col.innerHTML=`<div class="kcol-hd" style="border-top:3px solid ${corStrip}"><div class="kcol-title">${etapa.label}</div><div class="kcol-count">${items.length}</div></div><div class="kcol-body" id="body-${sid_}-${etapa.id}"></div>`;
    const body=col.querySelector('.kcol-body');

    items.forEach(eq=>{
      const ehSA=eq.semana&&eq.semana===semAtual;
      const dc=diasClass(visao==='geral'?eq.etapa_desde:eq.etapa_interna_desde);
      const dl=diasLabel(visao==='geral'?eq.etapa_desde:eq.etapa_interna_desde);
      const prioPill=eq.prioridade?`<span class="prio-pill prio-${eq.prioridade}">${prioLabel(eq.prioridade)}</span>`:'';
      const semPill=eq.semana&&!ehSA?`<span class="sem-pill">${semanaLabel(eq.semana)}</span>`:'';
      const semBadge=ehSA?'<span class="badge-semana-atual">★ Esta semana</span>':'';
      const resBadge=eq.reservado?`<span class="badge-reservado">◈ Reservado</span>`:'';
      const cliHTML=eq.reservado&&eq.cliente?`<div class="card-cliente">👤 ${eq.cliente}</div>`:'';
      const embHTML=eq.dataEmbarque?`<div class="card-embarque" style="color:#7F77DD">🚢 ${new Date(eq.dataEmbarque+'T12:00:00').toLocaleDateString('pt-BR')}</div>`:'';
      const assin=eq.assinaturas&&eq.assinaturas[eq.etapa];
      const assinHTML=assin?`<div class="card-assinatura">🔑 ${assin.perfil} · ${assin.data}</div>`:'';
      const osHTML=eq.ordemManusis?`<div style="font-size:9px;color:#7F77DD;margin-top:2px">📋 OS: ${eq.ordemManusis}</div>`:'';

      const card=document.createElement('div');
      card.className='card'+(ehSA?' semana-atual':'')+(eq.reservado?' reservado':'');
      card.innerHTML=`
        <div class="card-id">${eq.id}</div>
        <div class="card-equip">${eq.equipamento}</div>
        <div class="card-modelo">${eq.modelo||''}</div>
        <div class="card-tipo">${eq.tipo||''}</div>
        <div class="card-divider"></div>
        <div class="card-row">${resBadge}<div class="card-dias"><span class="dd ${dc}"></span>${dl}</div></div>
        ${prioPill||semPill||semBadge?`<div class="card-row" style="margin-top:3px">${prioPill}${semBadge}${semPill}</div>`:''}
        ${cliHTML}${embHTML}${assinHTML}${osHTML}`;
      body.appendChild(card);
    });
    board.appendChild(col);
  });
}

// Init
document.getElementById('hdate').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
loadAll();
</script>
